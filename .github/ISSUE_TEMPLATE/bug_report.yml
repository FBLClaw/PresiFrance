name: Bug report
description: Report a reproducible problem in PresiFrance.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest set of steps needed to reproduce the issue.
      placeholder: |
        1. Open ...
        2. Search for ...
        3. See ...
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: URL or route
      placeholder: https://presifrance.fr/...
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, device, or local Node/npm versions if relevant.
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Screenshots, console errors, data source links, or related issues.
